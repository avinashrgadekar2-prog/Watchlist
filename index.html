<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Watch List</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15121f">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #15121f;
    --surface: #211c2e;
    --gold: #f0b429;
    --red: #e2453c;
    --text: #f2ede4;
    --text-muted: #9a91ac;
    --border: #352f47;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }

  .page { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }

  /* --- Marquee header --- */
  .marquee { text-align: center; margin-bottom: 32px; }
  .marquee-border {
    height: 6px;
    background-image: radial-gradient(circle, var(--gold) 2.2px, transparent 2.5px);
    background-size: 22px 6px;
    background-repeat: repeat-x;
    background-position: center;
    margin: 10px 0;
    opacity: 0.85;
  }
  .marquee h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: 0.06em;
    margin: 8px 0 4px;
    color: var(--gold);
  }
  .marquee .tagline { color: var(--text-muted); margin: 0; font-size: 0.95rem; }

  /* --- Banner --- */
  .banner {
    background: var(--surface);
    border: 1px solid var(--gold);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 24px;
    font-size: 0.9rem;
  }
  .banner.error { border-color: var(--red); }

  /* --- Form --- */
  .rec-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 28px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }
  .field .optional { text-transform: none; letter-spacing: 0; opacity: 0.7; }

  input, select, textarea, button { font-family: inherit; font-size: 0.95rem; }
  input, select, textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    color: var(--text);
    width: 100%;
  }
  textarea { resize: vertical; min-height: 44px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .add-btn {
    background: var(--gold);
    color: #1a1625;
    border: none;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .add-btn:hover { transform: translateY(-1px); }
  .add-btn:disabled { opacity: 0.6; cursor: default; transform: none; }

  /* --- Toolbar (search / sort / surprise) --- */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input[type="text"] { flex: 1; min-width: 160px; }
  .toolbar select { width: auto; }
  .surprise-btn {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    font-weight: 600;
  }
  .surprise-btn:hover { background: rgba(226, 69, 60, 0.12); }

  /* --- Filters --- */
  .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .filter-btn.active { border-color: var(--gold); color: var(--gold); }

  /* --- List --- */
  .list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .empty { color: var(--text-muted); text-align: center; padding: 40px 0; grid-column: 1 / -1; }

  /* --- Ticket card --- */
  .card {
    position: relative;
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: var(--gold); }
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--bg);
    border-radius: 50%;
    left: 76px;
    transform: translateX(-50%);
    z-index: 3;
  }
  .card::before { top: -8px; }
  .card::after { bottom: -8px; }

  .stub {
    position: relative;
    width: 76px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 6px;
    border-right: 2px dashed var(--border);
    font-size: 1.6rem;
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }
  .stub.has-poster::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(21,18,31,0.8), rgba(21,18,31,0.15));
  }
  .stub-icon { position: relative; z-index: 1; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .stub-label {
    position: relative;
    z-index: 1;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    text-align: center;
  }
  .stub.has-poster .stub-label { color: var(--text); }

  .card.watched .stub::after {
    content: "WATCHED";
    position: absolute;
    inset: 8px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    color: var(--red);
    border: 2px solid var(--red);
    border-radius: 4px;
    transform: rotate(-10deg);
    background: rgba(21, 18, 31, 0.6);
  }

  .content { position: relative; flex: 1; padding: 16px 16px 14px; min-width: 0; }
  .content h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 1.4rem;
    letter-spacing: 0.03em;
    margin: 0 0 6px;
    color: var(--text);
    padding-right: 20px;
  }
  .content h3 .year { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0; }
  .note { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 10px; word-break: break-word; }

  .platform-chip {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid currentColor;
    margin-bottom: 8px;
  }

  .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .interested-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .interested-btn.active { border-color: var(--gold); color: var(--gold); }

  .stars { display: inline-flex; gap: 2px; }
  .star-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--border); padding: 0; }
  .star-btn.filled { color: var(--gold); }
  .avg-rating { font-size: 0.72rem; color: var(--text-muted); }

  .card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .recommender { font-size: 0.78rem; color: var(--text-muted); }
  .watch-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .card.watched .watch-btn { border-color: var(--text-muted); color: var(--text-muted); }
  .card.watched { opacity: 0.85; }

  .comments-toggle { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; margin-top: 4px; user-select: none; }
  .comments-toggle:hover { color: var(--gold); }
  .comments-panel { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  .comment { font-size: 0.78rem; margin: 0 0 6px; color: var(--text-muted); }
  .comment strong { color: var(--text); }
  .comment-input-row { display: flex; gap: 6px; margin-top: 6px; }
  .comment-input-row input { flex: 1; padding: 6px 8px; font-size: 0.8rem; }
  .comment-input-row button {
    background: var(--gold);
    color: #1a1625;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.78rem;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }

  .delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 4px;
    z-index: 4;
  }
  .delete-btn:hover { color: var(--red); }

  .card.highlight { animation: pulse-glow 1.2s ease-in-out 2; border-color: var(--gold); }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240,180,41,0); }
    50% { box-shadow: 0 0 0 6px rgba(240,180,41,0.25); }
  }

  .footer { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 40px; }

  @media (max-width: 640px) {
    .stub { width: 56px; }
    .card::before, .card::after { left: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="marquee">
      <div class="marquee-border"></div>
      <h1>The Watch List</h1>
      <p class="tagline">Recommendations from the crew, one ticket at a time</p>
      <div class="marquee-border"></div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <form id="recForm" class="rec-form" aria-label="Add a recommendation">
      <div class="form-grid">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" required maxlength="80" placeholder="e.g. Parasite">
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type">
            <option value="Movie">🎬 Movie</option>
            <option value="TV Series">📺 TV Series</option>
            <option value="Documentary">🎥 Documentary</option>
            <option value="Anime">🌸 Anime</option>
            <option value="Other">✨ Other</option>
          </select>
        </div>
        <div class="field">
          <label for="platform">Where to watch</label>
          <select id="platform" onchange="handlePlatformChange(this)"></select>
        </div>
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" required maxlength="30" placeholder="e.g. Priya">
        </div>
      </div>
      <div class="field">
        <label for="note">Why watch it? <span class="optional">optional</span></label>
        <textarea id="note" maxlength="140" placeholder="One line to sell the room on it"></textarea>
      </div>
      <button type="submit" class="add-btn">+ Add to the list</button>
    </form>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search titles, people, notes…">
      <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="az">A–Z</option>
        <option value="wanted">Most wanted</option>
      </select>
      <button type="button" class="surprise-btn" onclick="surpriseMe()">🎲 Surprise me</button>
    </div>

    <div class="filters" role="tablist" aria-label="Filter the list">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="unwatched">To watch</button>
      <button class="filter-btn" data-filter="watched">Watched</button>
    </div>

    <div id="list" class="list"></div>

    <p class="footer">made for movie-night arguments 🍿</p>
  </div>

  <!-- Firebase (compat build — simplest syntax for beginners) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

  <script>
    // ============================================================
    // FIREBASE CONFIG — already connected to your project.
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDUegzsqV2MLHzKQAnmi1KllNEmTGDoyyo",
      authDomain: "movie-watchlist-f3236.firebaseapp.com",
      projectId: "movie-watchlist-f3236",
      storageBucket: "movie-watchlist-f3236.firebasestorage.app",
      messagingSenderId: "897296685817",
      appId: "1:897296685817:web:57b071881531e3ca52e028",
      measurementId: "G-5XSRF1DF67"
    };

    const isDemo = firebaseConfig.apiKey === "YOUR_API_KEY";
    let recommendationsRef = null;
    let platformsRef = null;
    let db = null;

    if (!isDemo) {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      recommendationsRef = db.collection("recommendations");
      platformsRef = db.collection("meta").doc("platforms");
    }

    // --- Streaming platforms ---
    const DEFAULT_PLATFORMS = ["Netflix", "Disney+ Hotstar", "Zee5", "YouTube", "Voot", "Apple TV+", "Amazon Prime Video", "SonyLIV"];
    let customPlatforms = [];
    let allPlatforms = [...DEFAULT_PLATFORMS];
    let pendingPlatformSelect = null;

    const PLATFORM_PALETTE = [
      { fg: "#e5484d", bg: "rgba(229,72,77,0.15)" },
      { fg: "#3b82f6", bg: "rgba(59,130,246,0.15)" },
      { fg: "#a855f7", bg: "rgba(168,85,247,0.15)" },
      { fg: "#22c55e", bg: "rgba(34,197,94,0.15)" },
      { fg: "#f0b429", bg: "rgba(240,180,41,0.15)" },
      { fg: "#06b6d4", bg: "rgba(6,182,212,0.15)" },
      { fg: "#f97316", bg: "rgba(249,115,22,0.15)" },
      { fg: "#ec4899", bg: "rgba(236,72,153,0.15)" }
    ];
    function platformStyle(name) {
      if (!name) return PLATFORM_PALETTE[0];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % PLATFORM_PALETTE.length;
      return PLATFORM_PALETTE[Math.abs(hash) % PLATFORM_PALETTE.length];
    }

    function refreshPlatformSelect(selectValue) {
      const sel = document.getElementById("platform");
      const current = selectValue || sel.value;
      sel.innerHTML = allPlatforms.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("")
        + `<option value="__add_new__">+ Add a platform…</option>`;
      if (allPlatforms.includes(current)) sel.value = current;
    }

    function handlePlatformChange(selectEl) {
      if (selectEl.value !== "__add_new__") return;
      const input = prompt("Add a streaming platform (e.g. Jio Cinema):");
      selectEl.value = allPlatforms[0] || "__add_new__";
      if (!input) return;
      const name = input.trim();
      if (!name) return;
      const existing = allPlatforms.find(p => p.toLowerCase() === name.toLowerCase());
      if (existing) { selectEl.value = existing; return; }

      if (isDemo) {
        customPlatforms.push(name);
        allPlatforms = [...DEFAULT_PLATFORMS, ...customPlatforms];
        refreshPlatformSelect(name);
      } else {
        pendingPlatformSelect = name;
        platformsRef.set({ custom: firebase.firestore.FieldValue.arrayUnion(name) }, { merge: true })
          .catch(err => {
            console.error("Couldn't save platform:", err);
            showBanner("Couldn't save that platform — check the Firestore rules cover the 'meta' collection.", true);
          });
      }
    }

    if (isDemo) {
      refreshPlatformSelect();
    } else {
      refreshPlatformSelect();
      platformsRef.onSnapshot((doc) => {
        customPlatforms = (doc.exists && doc.data().custom) || [];
        allPlatforms = [...DEFAULT_PLATFORMS, ...customPlatforms];
        refreshPlatformSelect(pendingPlatformSelect || undefined);
        pendingPlatformSelect = null;
      }, (err) => console.warn("Platform list sync failed:", err));
    }

    // --- Demo data (used only until Firebase is connected) ---
    let demoRecs = [
      { id: "d1", title: "Spirited Away", type: "Anime", platform: "Netflix", name: "Sam", note: "Best animated film ever made, fight me.", watched: false, posterUrl: null, year: "2001", interested: ["Priya", "Alex"], ratings: [], comments: [{ name: "Priya", text: "So dreamy!", ts: Date.now() }] },
      { id: "d2", title: "The Bear", type: "TV Series", platform: "Disney+ Hotstar", name: "Priya", note: "Stressful but so good.", watched: true, posterUrl: null, year: "2022", interested: [], ratings: [{ name: "Sam", value: 4 }, { name: "Alex", value: 5 }], comments: [] },
      { id: "d3", title: "Won't You Be My Neighbor?", type: "Documentary", platform: "YouTube", name: "Alex", note: "", watched: false, posterUrl: null, year: "2018", interested: [], ratings: [], comments: [] }
    ];

    const form = document.getElementById("recForm");
    const list = document.getElementById("list");
    const banner = document.getElementById("banner");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    let currentFilter = "all";
    let currentSort = "newest";
    let searchTerm = "";
    let currentUser = null;
    let openComments = new Set();
    let allRecs = [];

    if (isDemo) {
      showBanner("You're viewing sample tickets — connect Firebase (see README.md) so everyone sees the same shared list.", false);
    }

    function getUserName() {
      if (currentUser) return currentUser;
      const name = prompt("What's your name?");
      if (name && name.trim()) { currentUser = name.trim(); return currentUser; }
      return null;
    }

    // --- Add a new recommendation ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const type = document.getElementById("type").value;
      const platformVal = document.getElementById("platform").value;
      const platform = platformVal === "__add_new__" ? "" : platformVal;
      const name = document.getElementById("name").value.trim();
      const note = document.getElementById("note").value.trim();

      if (!title || !name) return;
      currentUser = name;

      const submitBtn = form.querySelector(".add-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Adding…";

      const { posterUrl, year } = await fetchPosterInfo(title, type);

      const payload = {
        title, type, platform, name, note,
        watched: false, posterUrl, year,
        interested: [], ratings: [], comments: []
      };

      if (isDemo) {
        demoRecs.unshift({ id: "d" + Date.now(), ...payload });
        form.reset();
        renderList();
      } else {
        try {
          await recommendationsRef.add({ ...payload, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          form.reset();
        } catch (error) {
          console.error("Error adding recommendation:", error);
          showBanner("Couldn't add that — check your Firebase setup in the script.", true);
        }
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "+ Add to the list";
    });

    async function fetchPosterInfo(title, type) {
      try {
        const media = type === "TV Series" ? "tvShow" : "movie";
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(title)}&media=${media}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();
        const item = data.results && data.results[0];
        if (!item) return { posterUrl: null, year: null };
        const posterUrl = item.artworkUrl100 ? item.artworkUrl100.replace("100x100", "600x600") : null;
        const year = item.releaseDate ? item.releaseDate.slice(0, 4) : null;
        return { posterUrl, year };
      } catch (err) {
        console.warn("Poster lookup failed:", err);
        return { posterUrl: null, year: null };
      }
    }

    // --- Filters, search, sort ---
    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderList();
      });
    });
    searchInput.addEventListener("input", (e) => { searchTerm = e.target.value.toLowerCase(); renderList(); });
    sortSelect.addEventListener("change", (e) => { currentSort = e.target.value; renderList(); });

    // --- Load recommendations ---
    if (isDemo) {
      allRecs = demoRecs;
      renderList();
    } else {
      recommendationsRef.orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        allRecs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderList();
      }, (error) => {
        console.error("Error loading recommendations:", error);
        showBanner("Couldn't reach the list — double-check the Firebase config and security rules.", true);
      });
    }

    function myRating(rec) {
      if (!currentUser || !rec.ratings) return 0;
      const r = rec.ratings.find(x => x.name === currentUser);
      return r ? r.value : 0;
    }
    function avgRating(rec) {
      if (!rec.ratings || rec.ratings.length === 0) return null;
      const sum = rec.ratings.reduce((a, r) => a + r.value, 0);
      return (sum / rec.ratings.length).toFixed(1);
    }

    // --- Render ---
    function renderList() {
      let filtered = allRecs;
      if (currentFilter === "watched") filtered = filtered.filter(r => r.watched);
      if (currentFilter === "unwatched") filtered = filtered.filter(r => !r.watched);
      if (searchTerm) {
        filtered = filtered.filter(r =>
          r.title.toLowerCase().includes(searchTerm) ||
          r.name.toLowerCase().includes(searchTerm) ||
          (r.note || "").toLowerCase().includes(searchTerm)
        );
      }
      filtered = [...filtered];
      if (currentSort === "az") filtered.sort((a, b) => a.title.localeCompare(b.title));
      else if (currentSort === "oldest") filtered.reverse();
      else if (currentSort === "wanted") filtered.sort((a, b) => (b.interested || []).length - (a.interested || []).length);

      if (filtered.length === 0) {
        list.innerHTML = `<p class="empty">No recommendations yet — be the first to add one.</p>`;
        return;
      }

      list.innerHTML = filtered.map(rec => {
        const interestedList = rec.interested || [];
        const iAmIn = currentUser && interestedList.includes(currentUser);
        const style = platformStyle(rec.platform);
        const commentCount = (rec.comments || []).length;
        return `
        <div class="card ${rec.watched ? "watched" : ""}" data-id="${rec.id}">
          <div class="stub ${rec.posterUrl ? "has-poster" : ""}" ${rec.posterUrl ? `style="background-image:url('${rec.posterUrl}')"` : ""}>
            <span class="stub-icon">${typeEmoji(rec.type)}</span>
            <span class="stub-label">${escapeHtml(rec.type)}</span>
          </div>
          <div class="content">
            <button class="delete-btn" onclick="deleteRec('${rec.id}')" title="Remove" aria-label="Remove ${escapeHtml(rec.title)}">✕</button>
            ${rec.platform ? `<span class="platform-chip" style="color:${style.fg}; background:${style.bg}">${escapeHtml(rec.platform)}</span>` : ""}
            <h3>${escapeHtml(rec.title)}${rec.year ? ` <span class="year">(${escapeHtml(rec.year)})</span>` : ""}</h3>
            ${rec.note ? `<p class="note">${escapeHtml(rec.note)}</p>` : ""}
            <div class="meta-row">
              <button class="interested-btn ${iAmIn ? "active" : ""}" onclick="toggleInterested('${rec.id}')" title="${interestedList.join(", ") || "Be the first!"}">
                🙋 ${interestedList.length}${iAmIn ? " • you're in" : " interested"}
              </button>
            </div>
            ${rec.watched ? `
            <div class="meta-row">
              <span class="stars">${[1, 2, 3, 4, 5].map(n => `<button class="star-btn ${myRating(rec) >= n ? "filled" : ""}" onclick="setRating('${rec.id}', ${n})" aria-label="Rate ${n} star">★</button>`).join("")}</span>
              ${avgRating(rec) ? `<span class="avg-rating">avg ${avgRating(rec)} (${rec.ratings.length})</span>` : ""}
            </div>` : ""}
            <div class="card-bottom">
              <span class="recommender">— ${escapeHtml(rec.name)}</span>
              <button class="watch-btn" onclick="toggleWatched('${rec.id}', ${rec.watched})">
                ${rec.watched ? "Mark unwatched" : "Mark watched"}
              </button>
            </div>
            <div class="comments-toggle" onclick="toggleComments('${rec.id}')">💬 ${commentCount} comment${commentCount === 1 ? "" : "s"}</div>
            <div class="comments-panel" ${openComments.has(rec.id) ? "" : "hidden"}>
              ${(rec.comments || []).map(c => `<p class="comment"><strong>${escapeHtml(c.name)}:</strong> ${escapeHtml(c.text)}</p>`).join("")}
              <div class="comment-input-row">
                <input type="text" id="comment-input-${rec.id}" placeholder="Add a comment" maxlength="140">
                <button onclick="addComment('${rec.id}')">Send</button>
              </div>
            </div>
          </div>
        </div>
        `;
      }).join("");
    }

    function toggleWatched(id, current) {
      if (isDemo) {
        const rec = demoRecs.find(r => r.id === id);
        if (rec) rec.watched = !current;
        renderList();
        return;
      }
      recommendationsRef.doc(id).update({ watched: !current });
    }

    function deleteRec(id) {
      if (!confirm("Remove this recommendation?")) return;
      if (isDemo) { demoRecs = demoRecs.filter(r => r.id !== id); renderList(); return; }
      recommendationsRef.doc(id).delete();
    }

    function toggleInterested(id) {
      const name = getUserName();
      if (!name) return;
      const rec = allRecs.find(r => r.id === id);
      if (!rec) return;
      const already = (rec.interested || []).includes(name);
      const newList = already ? rec.interested.filter(n => n !== name) : [...(rec.interested || []), name];
      if (isDemo) { rec.interested = newList; renderList(); return; }
      recommendationsRef.doc(id).update({ interested: newList });
    }

    function setRating(id, value) {
      const name = getUserName();
      if (!name) return;
      const rec = allRecs.find(r => r.id === id);
      if (!rec) return;
      const others = (rec.ratings || []).filter(r => r.name !== name);
      const newRatings = [...others, { name, value }];
      if (isDemo) { rec.ratings = newRatings; renderList(); return; }
      recommendationsRef.doc(id).update({ ratings: newRatings });
    }

    function toggleComments(id) {
      if (openComments.has(id)) openComments.delete(id); else openComments.add(id);
      renderList();
    }

    function addComment(id) {
      const input = document.getElementById(`comment-input-${id}`);
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      const name = getUserName();
      if (!name) return;
      const rec = allRecs.find(r => r.id === id);
      if (!rec) return;
      const newComments = [...(rec.comments || []), { name, text, ts: Date.now() }];
      openComments.add(id);
      if (isDemo) { rec.comments = newComments; renderList(); return; }
      recommendationsRef.doc(id).update({ comments: newComments });
    }

    function surpriseMe() {
      const unwatched = allRecs.filter(r => !r.watched);
      if (unwatched.length === 0) {
        showBanner("Nothing left to watch — add something new!", false);
        return;
      }
      const pick = unwatched[Math.floor(Math.random() * unwatched.length)];
      currentFilter = "all";
      searchTerm = "";
      searchInput.value = "";
      filterButtons.forEach(b => b.classList.remove("active"));
      document.querySelector('[data-filter="all"]').classList.add("active");
      renderList();
      setTimeout(() => {
        const el = document.querySelector(`[data-id="${pick.id}"]`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("highlight");
          setTimeout(() => el.classList.remove("highlight"), 2500);
        }
      }, 60);
    }

    function typeEmoji(type) {
      const map = { "Movie": "🎬", "TV Series": "📺", "Documentary": "🎥", "Anime": "🌸", "Other": "✨" };
      return map[type] || "✨";
    }

    function showBanner(message, isError) {
      banner.textContent = message;
      banner.hidden = false;
      banner.classList.toggle("error", !!isError);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : str;
      return div.innerHTML;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => console.warn("Service worker registration failed:", err));
      });
    }
  </script>
</body>
</html>
